# Nginx for the Docker stack (mounted into the nginx container by docker-compose.yml).
#
# - atlas-aim.com  ->  www.atlas-aim.com (one canonical domain for SEO)
# - /static/ and /media/ are served directly from the shared volumes
# - everything else is proxied to Gunicorn

upstream atlas_web {
    server web:8000;
}

# Keep the original protocol when a CDN / load balancer already terminates TLS in front of us.
map $http_x_forwarded_proto $atlas_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name atlas-aim.com;
    return 301 $atlas_proto://www.atlas-aim.com$request_uri;
}

server {
    listen 80 default_server;
    server_name www.atlas-aim.com;

    # When TLS is handled by this nginx (443 block below), uncomment to force HTTPS:
    # return 301 https://www.atlas-aim.com$request_uri;

    include /etc/nginx/conf.d/atlas-locations.inc;
}

