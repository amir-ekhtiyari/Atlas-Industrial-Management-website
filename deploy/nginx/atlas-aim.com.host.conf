# Nginx on the host (deployment WITHOUT Docker), with HTTPS via Let's Encrypt.
#
#   sudo cp deploy/nginx/atlas-aim.com.host.conf /etc/nginx/sites-available/atlas-aim.com
#   sudo ln -s /etc/nginx/sites-available/atlas-aim.com /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d atlas-aim.com -d www.atlas-aim.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# Paths assume the project is in /srv/atlas (STATIC_ROOT=/srv/atlas/staticfiles,
# MEDIA_ROOT=/srv/atlas/media).

upstream atlas_web {
    server 127.0.0.1:8000;
}

# Everything on HTTP -> https://www.atlas-aim.com
server {
    listen 80;
    listen [::]:80;
    server_name atlas-aim.com www.atlas-aim.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://www.atlas-aim.com$request_uri; }
}

# https://atlas-aim.com -> https://www.atlas-aim.com
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name atlas-aim.com;
    ssl_certificate     /etc/letsencrypt/live/atlas-aim.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atlas-aim.com/privkey.pem;
    return 301 https://www.atlas-aim.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.atlas-aim.com;

    ssl_certificate     /etc/letsencrypt/live/atlas-aim.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atlas-aim.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;
    gzip_min_length 1024;

    location /static/ {
        alias /srv/atlas/staticfiles/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /srv/atlas/media/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    location / {
        proxy_pass http://atlas_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
