# Atlas Industrial Management — production stack.
#
#   cp .env.production.example .env      # then fill in the real secrets
#   docker compose up -d --build
#   docker compose exec web python manage.py createsuperuser
#
# Nginx listens on port 80. TLS (https://www.atlas-aim.com) is terminated either by
# the host / CDN in front of this stack, or by enabling the 443 server block in
# deploy/nginx/atlas.conf — see DEPLOY.md.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      # - "443:443"          # uncomment together with the TLS block in deploy/nginx/atlas.conf
    volumes:
      - ./deploy/nginx/atlas.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/atlas-locations.inc:/etc/nginx/conf.d/atlas-locations.inc:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
      # - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  postgres_data:
  static_files:
  media_files:
